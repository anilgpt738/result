<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | Usha Institute Of Computer Education</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        .login-wrap {
            min-height: calc(100vh - 280px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            background: var(--lavender);
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 25px rgba(17, 12, 45, 0.08);
            overflow: hidden;
        }
        .brand-header {
            background: var(--dark);
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
            border-bottom: 3px solid var(--maroon);
        }
    </style>
</head>
<body>

    <!-- Shared Header Mount -->
    <div id="siteHeaderMount"></div>

    <div class="login-wrap">
        <div class="card login-card">
            <div class="brand-header">
                <a href="/" class="text-decoration-none">
                    <img src="/uploads/logo.png" onerror="this.src='https://center.pmkvyedu.com/upload/logo/1787653813.png'" alt="Logo" height="60" class="mb-2">
                    <h4 class="fw-bold mb-1" style="color: #ffffff; font-family: var(--font-head); letter-spacing: 1px;">USHA INSTITUTE</h4>
                    <div class="small" style="color: var(--body);">Student Self-Service Portal</div>
                    <span class="badge mt-2" style="background: var(--maroon); color: #fff; font-size: 11px;">ATC: IN/UP/MAU/29172</span>
                </a>
            </div>
            
            <div class="card-body p-4">
                <form id="studentLoginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Enrollment / Application / Roll No. *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
                            <input type="text" id="loginAppNo" class="form-control" placeholder="e.g. UIS2026001, APP2026001, or 202601000013" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Registered Mobile Number *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                            <input type="tel" id="loginMobile" class="form-control" placeholder="10-Digit Mobile Number" maxlength="10" required>
                        </div>
                        <small class="text-muted" style="font-size: 11px;">Sample test login: <code>UIS2026001</code> / <code>7275043143</code></small>
                    </div>

                    <div id="loginAlert" class="alert d-none py-2 px-3 small mb-3" role="alert"></div>

                    <button type="submit" id="loginBtn" class="btn btn-primary btn-pill w-100 py-2 fw-bold mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Student Portal
                    </button>
                </form>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top small">
                    <a href="/" class="text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Home</a>
                    <a href="/apply" class="text-primary text-decoration-none fw-semibold">New Admission Form</a>
                    <a href="/certificate" class="text-muted text-decoration-none">Verify Cert</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared Footer Mount -->
    <div id="siteFooterMount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/main.js"></script>

    <script>
    document.getElementById('studentLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const appNo = document.getElementById('loginAppNo').value.trim();
        const mobile = document.getElementById('loginMobile').value.trim();
        const alertBox = document.getElementById('loginAlert');
        const loginBtn = document.getElementById('loginBtn');

        alertBox.classList.add('d-none');
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Signing in...';

        try {
            const response = await fetch('/api/students/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appNo, mobile })
            });

            const result = await response.json();

            if (result.success && result.student) {
                sessionStorage.setItem('loggedInStudent', JSON.stringify(result.student));
                localStorage.setItem('studentAuthToken', 'session_' + Date.now());
                window.location.href = '/student-dashboard';
            } else {
                alertBox.className = 'alert alert-danger py-2 small';
                alertBox.innerText = result.message || 'Incorrect details. Please check your Registration No. and Mobile Number.';
                alertBox.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Login Error:', error);
            alertBox.className = 'alert alert-danger py-2 small';
            alertBox.innerText = 'Server error during sign in. Check if server is running.';
            alertBox.classList.remove('d-none');
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Student Portal';
        }
    });
    </script>
</body>
</html>
